<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CI/CD Presentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#FCFCFC',
              primary: '#277884',
              secondary: '#3A342F',
              accent: '#F57325',
            },
            fontFamily: {
              'lato': ['Lato', 'sans-serif'],
              'montserrat': ['Montserrat', 'sans-serif'],
            },
            keyframes: {
              rise: {
                'from': { opacity: '0', transform: 'translateY(20px)' },
                'to': { opacity: '1', transform: 'translateY(0)' },
              },
              'fade-in': {
                'from': { opacity: '0' },
                'to': { opacity: '1' },
              },
              'pan-in': {
                'from': { opacity: '0', transform: 'translateX(-20px)' },
                'to': { opacity: '1', transform: 'translateX(0)' },
              },
              'pop-in': {
                'from': { opacity: '0', transform: 'scale(0.8)' },
                'to': { opacity: '1', transform: 'scale(1)' },
              },
              stamp: {
                'from': { opacity: '0', transform: 'scale(3) rotate(-30deg)' },
                'to': { opacity: '1', transform: 'scale(1) rotate(0deg)' },
              },
              build: {
                'from': { transform: 'scaleY(0)' },
                'to': { transform: 'scaleY(1)' },
              },
              shatter: {
                '0%': { opacity: '1', transform: 'scaleY(1)' },
                '100%': { opacity: '0', transform: 'translateY(100px) scaleY(0.5)' },
              },
              draw: {
                'to': { 'stroke-dashoffset': '0' },
              }
            },
            animation: {
              'rise': 'rise 0.8s ease-out forwards',
              'fade-in': 'fade-in 0.8s ease-out forwards',
              'pan-in': 'pan-in 0.8s ease-out forwards',
              'pop-in': 'pop-in 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards',
              'stamp': 'stamp 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards',
              'build': 'build 1s ease-out forwards',
              'shatter': 'shatter 1s ease-out forwards',
              'draw': 'draw 3s ease-in-out forwards',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/",
    "react-icons/": "https://esm.sh/react-icons@^5.5.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
